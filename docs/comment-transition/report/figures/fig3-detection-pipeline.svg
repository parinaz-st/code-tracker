<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Cambria, 'Times New Roman', serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <rect width="720" height="380" fill="#fff"/>
  <text x="20" y="28" font-weight="bold">Tracked element t in commit F, body mapper M(E, F)</text>
  <!-- decisions -->
  <g>
    <polygon points="130,50 240,80 130,110 20,80" fill="#fff" stroke="#222"/>
    <text x="130" y="84" text-anchor="middle">refactored?</text>
    <polygon points="130,130 240,160 130,190 20,160" fill="#fff" stroke="#222"/>
    <text x="130" y="164" text-anchor="middle">matched?</text>
    <polygon points="130,210 240,240 130,270 20,240" fill="#eef4fb" stroke="#1f4e79" stroke-width="1.6"/>
    <text x="130" y="236" text-anchor="middle" fill="#1f4e79" font-weight="bold">exact</text>
    <text x="130" y="252" text-anchor="middle" fill="#1f4e79">uncomment?</text>
    <polygon points="130,290 240,320 130,350 20,320" fill="#eef4fb" stroke="#1f4e79" stroke-width="1.6"/>
    <text x="130" y="316" text-anchor="middle" fill="#1f4e79" font-weight="bold">edit-tolerant</text>
    <text x="130" y="332" text-anchor="middle" fill="#1f4e79">uncomment?</text>
    <line x1="130" y1="110" x2="130" y2="128" stroke="#222" marker-end="url(#a)"/>
    <line x1="130" y1="190" x2="130" y2="208" stroke="#222" marker-end="url(#a)"/>
    <line x1="130" y1="270" x2="130" y2="288" stroke="#222" marker-end="url(#a)"/>
    <text x="138" y="122" font-size="11">no</text><text x="138" y="202" font-size="11">no</text><text x="138" y="282" font-size="11">no</text>
  </g>
  <!-- outcomes -->
  <g font-size="12">
    <line x1="240" y1="80" x2="298" y2="80" stroke="#222" marker-end="url(#a)"/>
    <rect x="300" y="62" width="400" height="36" fill="#fff" stroke="#222"/>
    <text x="312" y="85">refactoring change (unchanged CodeTracker behaviour)</text>
    <line x1="240" y1="160" x2="298" y2="160" stroke="#222" marker-end="url(#a)"/>
    <rect x="300" y="134" width="400" height="52" fill="#fff" stroke="#222"/>
    <text x="312" y="154">body change, <tspan fill="#1f4e79">plus</tspan> commented-out / uncommented statement</text>
    <text x="312" y="174" font-style="italic">statement-level evidence from the comment diff (ADR 0005)</text>
    <line x1="240" y1="240" x2="298" y2="240" stroke="#1f4e79" marker-end="url(#a)"/>
    <rect x="300" y="214" width="400" height="52" fill="#eef4fb" stroke="#1f4e79"/>
    <text x="312" y="234">uncommented block; hashes of signature and body match</text>
    <text x="312" y="254" font-style="italic">the deleted comments (original algorithm, normalized)</text>
    <line x1="240" y1="320" x2="298" y2="320" stroke="#1f4e79" marker-end="url(#a)"/>
    <rect x="300" y="294" width="400" height="52" fill="#eef4fb" stroke="#1f4e79"/>
    <text x="312" y="314">uncommented block + expression / body change;</text>
    <text x="312" y="334" font-style="italic">RM maps t to code on a virtually uncommented line</text>
    <line x1="130" y1="350" x2="130" y2="366" stroke="#222"/>
    <line x1="130" y1="366" x2="298" y2="366" stroke="#222" marker-end="url(#a)"/>
    <text x="138" y="362" font-size="11">no</text>
    <text x="312" y="370">added → "introduced"</text>
  </g>
  <text x="560" y="30" font-size="11" fill="#1f4e79" text-anchor="middle">shaded: comment-transition detection;</text>
  <text x="560" y="44" font-size="11" fill="#1f4e79" text-anchor="middle">both uncomment paths leave a pending node</text>
</svg>
