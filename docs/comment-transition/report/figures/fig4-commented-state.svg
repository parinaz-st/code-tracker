<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Cambria, 'Times New Roman', serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fff"/>
  <!-- commit timeline -->
  <text x="20" y="28" font-weight="bold">Commits (oldest → newest)</text>
  <line x1="40" y1="60" x2="690" y2="60" stroke="#222" marker-end="url(#a)"/>
  <g font-size="12" text-anchor="middle">
    <circle cx="70" cy="60" r="6" fill="#222"/><text x="70" y="44" font-weight="bold">A</text><text x="70" y="82">introduced</text>
    <circle cx="180" cy="60" r="6" fill="#222"/><text x="180" y="44" font-weight="bold">B</text><text x="180" y="82">active, edited</text>
    <circle cx="290" cy="60" r="6" fill="#222"/><text x="290" y="44" font-weight="bold">C</text><text x="290" y="82">active, edited</text>
    <circle cx="400" cy="60" r="6" fill="#fff" stroke="#222"/><text x="400" y="44" font-weight="bold">D</text><text x="400" y="82">commented out</text>
    <circle cx="510" cy="60" r="6" fill="#fff" stroke="#222"/><text x="510" y="44" font-weight="bold">E</text><text x="510" y="82">still commented;</text><text x="510" y="96">other code edited</text>
    <circle cx="630" cy="60" r="6" fill="#222"/><text x="630" y="44" font-weight="bold">F</text><text x="630" y="82">restored</text><text x="630" y="96">(tracking starts)</text>
  </g>
  <!-- search arrow -->
  <path d="M620,128 L300,128" fill="none" stroke="#1f4e79" stroke-dasharray="6,4" marker-end="url(#b)"/>
  <text x="460" y="122" text-anchor="middle" font-size="12" fill="#1f4e79">followCommented…: walk back while the element is found as a comment</text>
  <!-- history graph -->
  <text x="20" y="168" font-weight="bold">Recorded history graph</text>
  <g font-size="12">
    <rect x="30" y="186" width="80" height="34" rx="4" fill="#fff" stroke="#222"/><text x="70" y="207" text-anchor="middle">t@A</text>
    <rect x="140" y="186" width="80" height="34" rx="4" fill="#fff" stroke="#222"/><text x="180" y="207" text-anchor="middle">t@B</text>
    <rect x="250" y="186" width="80" height="34" rx="4" fill="#fff" stroke="#222"/><text x="290" y="207" text-anchor="middle">t@C</text>
    <rect x="360" y="186" width="80" height="34" rx="4" fill="#f2f2f2" stroke="#222" stroke-dasharray="4,3"/><text x="400" y="207" text-anchor="middle">node@D</text>
    <rect x="470" y="186" width="80" height="34" rx="4" fill="#f2f2f2" stroke="#222" stroke-dasharray="4,3"/><text x="510" y="207" text-anchor="middle">virtual@E</text>
    <rect x="590" y="186" width="80" height="34" rx="4" fill="#fff" stroke="#222"/><text x="630" y="207" text-anchor="middle">t@F</text>
    <line x1="110" y1="203" x2="138" y2="203" stroke="#222" marker-end="url(#a)"/>
    <line x1="220" y1="203" x2="248" y2="203" stroke="#222" marker-end="url(#a)"/>
    <line x1="330" y1="203" x2="358" y2="203" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#b)"/>
    <line x1="440" y1="203" x2="468" y2="203" stroke="#999" stroke-dasharray="4,3" marker-end="url(#a)"/>
    <line x1="550" y1="203" x2="588" y2="203" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#b)"/>
    <text x="124" y="244" text-anchor="middle">body change</text>
    <text x="234" y="244" text-anchor="middle">body change</text>
    <text x="344" y="244" text-anchor="middle" fill="#1f4e79" font-weight="bold">commented out</text>
    <text x="454" y="244" text-anchor="middle" fill="#777">no change</text>
    <text x="569" y="244" text-anchor="middle" fill="#1f4e79" font-weight="bold">uncommented</text>
    <text x="70" y="244" text-anchor="middle" font-style="italic">(introduced)</text>
  </g>
  <text x="20" y="282" font-size="12" font-style="italic">Dashed nodes do not exist as code in their commit. virtual@E is created at F (detection); node@D and the</text>
  <text x="20" y="296" font-size="12" font-style="italic">commented-out edge are added when an active version is found at C (confirmation); tracking then resumes from t@C.</text>
</svg>
