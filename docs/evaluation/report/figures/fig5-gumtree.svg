<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Cambria, 'Times New Roman', serif" font-size="12">
  <rect width="760" height="380" fill="#fff"/>
  <text x="180" y="20" text-anchor="middle" font-weight="bold" font-size="13">Parent commit AST</text>
  <text x="580" y="20" text-anchor="middle" font-weight="bold" font-size="13">Child commit AST</text>
  <!-- parent tree -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="180" y1="52" x2="180" y2="82"/>
    <line x1="180" y1="102" x2="100" y2="142"/><line x1="180" y1="102" x2="260" y2="142"/>
    <line x1="260" y1="162" x2="215" y2="202"/><line x1="260" y1="162" x2="305" y2="202"/>
  </g>
  <g stroke="#000" stroke-width="1.1" fill="#f2f2f2">
    <rect x="130" y="32" width="100" height="20" rx="4"/>
    <rect x="130" y="82" width="100" height="20" rx="4"/>
    <rect x="50" y="142" width="100" height="20" rx="4"/>
    <rect x="210" y="142" width="100" height="20" rx="4" fill="#d6d6d6"/>
    <rect x="175" y="202" width="80" height="20" rx="4"/>
    <rect x="265" y="202" width="80" height="20" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="180" y="46">MethodBody</text>
    <text x="180" y="96">IfStatement P1</text>
    <text x="100" y="156">then: return x;</text>
    <text x="260" y="156">else-Block P2</text>
    <text x="215" y="216">S1;</text>
    <text x="305" y="216">S2;</text>
  </g>
  <!-- child tree -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="580" y1="52" x2="580" y2="82"/>
    <line x1="580" y1="102" x2="490" y2="142"/><line x1="580" y1="102" x2="670" y2="142"/>
    <line x1="670" y1="162" x2="625" y2="202"/><line x1="670" y1="162" x2="715" y2="202"/>
    <line x1="715" y1="222" x2="680" y2="262"/><line x1="715" y1="222" x2="745" y2="262"/>
  </g>
  <g stroke="#000" stroke-width="1.1" fill="#f2f2f2">
    <rect x="530" y="32" width="100" height="20" rx="4"/>
    <rect x="530" y="82" width="100" height="20" rx="4"/>
    <rect x="440" y="142" width="100" height="20" rx="4"/>
    <rect x="620" y="142" width="100" height="20" rx="4"/>
    <rect x="585" y="202" width="80" height="20" rx="4"/>
    <rect x="675" y="202" width="80" height="20" rx="4" fill="#d6d6d6"/>
    <rect x="650" y="262" width="60" height="20" rx="4"/>
    <rect x="715" y="262" width="40" height="20" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="580" y="46">MethodBody</text>
    <text x="580" y="96">IfStatement C1</text>
    <text x="490" y="156">then: return x;</text>
    <text x="670" y="156">else: if C2 (new)</text>
    <text x="625" y="216">then: log();</text>
    <text x="715" y="216">else-Block C3</text>
    <text x="680" y="276">S1;</text>
    <text x="735" y="276">S2;</text>
  </g>
  <!-- mappings -->
  <g stroke="#000" stroke-width="1.1" fill="none" stroke-dasharray="4,3">
    <path d="M230,92 C380,92 380,92 530,92"/>
    <path d="M100,162 C100,290 490,290 490,162"/>
  </g>
  <path d="M310,152 C420,152 400,300 560,300 C640,300 640,212 673,212" stroke="#000" stroke-width="2" fill="none"/>
  <text x="470" y="322" text-anchor="middle" font-style="italic">identical subtrees P2 and C3: matched first (top-down), without checking their parents</text>
  <text x="380" y="84" text-anchor="middle" font-style="italic">bottom-up phase</text>
  <text x="380" y="358" text-anchor="middle" font-size="12">GumTree maps nodes in two phases: first the largest identical subtrees (top-down), then parents with at least half of</text>
  <text x="380" y="374" text-anchor="middle" font-size="12">their children mapped (bottom-up). An else-branch can be mapped on its own, without checking its parent if (TSE 2024, Fig. 10).</text>
</svg>
