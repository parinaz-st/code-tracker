<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Cambria, 'Times New Roman', serif" font-size="13">
  <rect width="640" height="300" fill="#fff"/>
  <circle cx="240" cy="150" r="125" fill="#bdbdbd" fill-opacity="0.35" stroke="#000" stroke-width="1.3"/>
  <circle cx="400" cy="150" r="125" fill="#7a7a7a" fill-opacity="0.25" stroke="#000" stroke-width="1.3"/>
  <text x="170" y="20" text-anchor="middle" font-weight="bold">E: oracle (expected)</text>
  <text x="470" y="20" text-anchor="middle" font-weight="bold">D: tool (detected)</text>
  <g text-anchor="middle" font-size="12">
    <text x="175" y="118" font-weight="bold">FN = E \ D</text>
    <text x="175" y="142">B · rename</text>
    <text x="175" y="160">C · body change</text>
    <text x="320" y="118" font-weight="bold">TP = E ∩ D</text>
    <text x="320" y="142">A · introduced</text>
    <text x="320" y="160">B · body change</text>
    <text x="467" y="118" font-weight="bold">FP = D \ E</text>
    <text x="467" y="142">C · expression change</text>
    <text x="467" y="160">D · body change</text>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="12">Each item is a key commitId + change type. Here TP = 2, FP = 2, FN = 2, so precision = recall = 50% at change level.</text>
</svg>
