  </g>
  <g text-anchor="middle">
    <text x="90" y="102" font-weight="bold">72b1d0c</text>
    <text x="90" y="122" font-size="12">if-block, L573–575</text>
    <text x="275" y="102" font-weight="bold">c3a08e1</text>
    <text x="275" y="122" font-size="12">as // lines, L576–578</text>
    <text x="460" y="102" font-weight="bold">2507785</text>
    <text x="460" y="122" font-size="12">still commented</text>
    <text x="655" y="102" font-weight="bold">fc0e703 (start)</text>
