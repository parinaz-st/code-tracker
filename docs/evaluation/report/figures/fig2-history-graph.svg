  </g>
  <g stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="150" y1="108" x2="213" y2="108"/>
    <line x1="335" y1="108" x2="398" y2="108"/>
    <line x1="520" y1="108" x2="583" y2="108"/>
  </g>
  <g text-anchor="middle" font-size="12" font-style="italic">
    <text x="182" y="66">commented</text>
    <text x="182" y="80">out block</text>
    <text x="367" y="74">not changed</text>
    <text x="552" y="66">uncommented</text>
    <text x="552" y="80">block</text>
  </g>
  <!-- introduced -->
