  <line x1="90" y1="148" x2="90" y2="138" stroke="#000" marker-end="url(#a)"/>
  <text x="380" y="30" text-anchor="middle" font-size="12">nodes = versions of the element (commit, file, name with line range); edges = changes between parent and child commit</text>
  <g font-size="12" text-anchor="middle">
