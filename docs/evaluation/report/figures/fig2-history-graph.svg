  <text x="730" y="220" text-anchor="end" font-style="italic" font-size="12">commit history (older → newer); tracking runs right to left</text>
  <!-- nodes -->
  <g stroke="#000" stroke-width="1.2" fill="#f2f2f2">
    <rect x="30" y="80" width="120" height="56" rx="6"/>
    <rect x="215" y="80" width="120" height="56" rx="6"/>
